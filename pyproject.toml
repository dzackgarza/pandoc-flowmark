# ---- Project Info and Dependencies ----

[project.urls]
Repository = "https://github.com/dzackgarza/pandoc-flowmark"
# Homepage = "https://..."
# Documentation = "https://..."

[project]
name = "flowmark"
description = "Better auto-formatting for Markdown and plaintext"
authors = [
    { name="Joshua Levy", email="joshua@cal.berkeley.edu" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dynamic = ["version"]

# https://pypi.org/classifiers/
# Adjust as needed:
classifiers = [
    # Adjust as needed:
    "Development Status :: 4 - Beta",
    # "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    # Include this to avoid accidentally publishing to PyPI:
    # "Private :: Do Not Upload",
]

dependencies = [
    "pathspec>=0.12.1",
    "platformdirs>=4.2",
    "rapidfuzz>=3.9",
    "strif>=3.0.1",
    "typing-extensions>=4.12.2",
]


[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-sugar>=1.0.0",
    "ruff>=0.11.9",
    "codespell>=2.4.1",
    "rich>=14.0.0",
    "basedpyright==1.29.5",  # TODO: Upgrade when Cursor supports it.
    "funlog>=0.2.1",
]


[project.scripts]
# Add script entry points here.
flowmark = "flowmark.cli:main"
flowmark-lint = "flowmark.lint_cli:main"



# ---- Build system ----

# Dynamic versioning from:
# https://github.com/ninoseki/uv-dynamic-versioning/

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"
# Note JSON schemas don't seem to be right for tool.hatch.version.source so
# this may cause false warnings in IDEs.
# https://github.com/ninoseki/uv-dynamic-versioning/issues/21

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
# Source archives/submodule exports have no live .git metadata. They remain
# installable as standalone Flowmark distributions under an explicit sentinel
# version instead of making Git checkout state a runtime requirement.
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
# The source location for the package.
packages = ["src/flowmark"]


# ---- Settings ----

# NOTE: ruff configuration is owned by global QC (~/ai-review-ci). A local ruff
# tool-config section is forbidden by the ai-review-ci Python preflight and was
# removed when this repo adopted global QC delegation.

[tool.basedpyright]
# BasedPyright currently seems like the best type checker option, much faster
# than mypy and with a good extension for VSCode/Cursor.
# https://marketplace.visualstudio.com/items?itemName=detachhead.basedpyright
# https://docs.basedpyright.com/latest/configuration/config-files/#sample-pyprojecttoml-file
include = ["src", "tests", "devtools"]

# By default BasedPyright is very strict, so you almost certainly want to disable
# some of the rules.
# First, these turn off warnings about (yes) how you ignore warnings:
reportIgnoreCommentWithoutRule = false
reportUnnecessaryTypeIgnoreComment = false
# A few typically noisy warnings are next.
# How many you enable is up to you. The first few are off by default, but you can
# comment/uncomment these as desired:
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportAny = false
reportExplicitAny = false
reportImplicitStringConcatenation = false
# reportUnreachable = false
# reportUnusedParameter = false
# reportPrivateImportUsage = false
# reportPrivateLocalImportUsage = false
# reportMissingImports = false
# reportUnnecessaryIsInstance = false
# reportUnreachable = false
# reportUnknownVariableType = false
# reportUnknownArgumentType = false

[tool.codespell]
# Add here as needed:
# ignore-words-list = "foo,bar"
# The TeXstudio command index is generated data of TeX command names.
skip = "tests/testdocs/*.md,src/flowmark/data/texstudio-command-index.json"

[tool.pytest.ini_options]
python_files = ["*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = [
    "src",
    "tests",
]
norecursedirs = []
filterwarnings = []
